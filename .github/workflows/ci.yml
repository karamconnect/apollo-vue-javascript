name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

# A new push to the same PR cancels the run that's still in progress.
concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

# Lint, tests and build run as parallel jobs so each reports its own status check.
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint:check

    test:
        name: Unit tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    build:
        name: Build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
