# CI for pull requests: lint, unit tests and build, run in parallel on one shared npm install.
# Replaced the GitHub Actions workflow. Start a run from local changes with: rwx run .rwx/ci.yml --open
on:
  github:
    # Default actions are opened, reopened and synchronize, as in the GitHub workflow.
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        pr-number: ${{ event.github.pull_request.number }}
      # One check per task, named like the old GitHub jobs, so each reports on its own.
      # Branch protection must require the RWX check names instead of the GitHub Actions ones.
      status-checks:
        default:
          name: CI
        custom:
          - tasks: lint
            name: Lint
          - tasks: test
            name: Unit tests
          - tasks: build
            name: Build
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      pr-number: ''

# A new push to the same PR cancels the run that's still in progress (GitHub `concurrency` +
# `cancel-in-progress`). Not applied to local CLI runs, which have no PR number.
concurrency-pools:
  - id: Karam-Connect/apollo_template:pr-${{ init.pr-number }}
    if: ${{ init.pr-number != '' }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/Karam-Connect/apollo_template.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }} # private repository: token from the RWX GitHub App

  # Node version from .nvmrc, like setup-node's node-version-file. Cached until .nvmrc changes.
  - key: node
    call: nodejs/install 1.2.0
    use: code
    with:
      node-version-file: .nvmrc
    filter:
      - .nvmrc

  # Shared by lint, test and build. Cached until the manifest or lockfile changes, which
  # replaces setup-node's npm cache.
  - key: npm-install
    use: [code, node]
    run: npm ci
    filter:
      - package.json
      - package-lock.json

  - key: lint
    use: npm-install
    run: npm run lint:check
    outputs:
      problems:
        - matcher: eslint

  - key: test
    use: npm-install
    run: npm test -- --reporter=default --reporter=json --outputFile=tmp/vitest.json
    outputs:
      test-results:
        - path: tmp/vitest.json

  - key: build
    use: npm-install
    run: npm run build
